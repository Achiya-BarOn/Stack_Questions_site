<script>
  // Same delimiters as Moodle's MathJax filter.
  window.MathJax = {
    // textmacros is off as in Moodle's MathJax 2, where "\\text{unit_step(x)}" shows literally.
    tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]], processEscapes: false,
           packages: { "[-]": ["textmacros"] } },
    options: { ignoreHtmlClass: "tex2jax_ignore" },
    startup: { typeset: false },
    chtml: { fontURL: "lib/mathjax/output/chtml/fonts/woff-v2" },
  };
</script>
<script src="lib/mathjax/tex-chtml-full.js"></script>
